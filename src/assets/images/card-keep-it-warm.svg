<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#0e3a52"/><rect width="4" height="10" fill="#38bdf8" opacity=".55"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    .b2{animation-delay:.25s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x=".5" y=".5" width="799" height="459" rx="20" fill="#0b1220" stroke="#24324f"/>
  <text x="40" y="52" class="mono" font-size="19" fill="#fbbf24" letter-spacing="1.5">LLM COST · PROMPT CACHING</text>
  <text x="40" y="96" class="sans" font-size="34" font-weight="800" fill="#f8fafc">Keep It Warm</text>
  <text x="40" y="130" class="sans" font-size="22" fill="#94a3b8">Trimming an agent's context can make it cost more.</text>

  <g class="sans" font-size="21">
    <text x="40" y="182" fill="#e2e8f0">Full history</text>
    <g class="bar"><rect x="200" y="164" width="470" height="26" rx="6" fill="url(#hatch)"/><rect x="630" y="164" width="40" height="26" rx="6" fill="#38bdf8"/></g>
    <text x="684" y="183" fill="#7dd3fc" font-size="19">cached</text>

    <text x="40" y="232" fill="#e2e8f0">Trimmed</text>
    <rect x="200" y="214" width="310" height="26" rx="6" fill="#f87171" class="bar b2"/>
    <text x="524" y="233" fill="#fca5a5" font-size="19">cache miss</text>
  </g>
  <g class="mono" font-size="17" fill="#64748b">
    <rect x="200" y="256" width="16" height="16" rx="3" fill="url(#hatch)"/><text x="222" y="270">discounted</text>
    <rect x="360" y="256" width="16" height="16" rx="3" fill="#f87171"/><text x="384" y="270">full price</text>
  </g>

  <g class="sans">
    <rect x="40" y="296" width="350" height="64" rx="12" fill="#0f2f26" stroke="#1d5c47"/>
    <text x="60" y="338" font-size="28" font-weight="800" fill="#6ee7b7">−22–46%</text>
    <text x="232" y="336" font-size="20" fill="#a7f3d0">fewer tokens</text>
    <rect x="410" y="296" width="350" height="64" rx="12" fill="#3b1518" stroke="#7f1d1d"/>
    <text x="430" y="338" font-size="28" font-weight="800" fill="#fca5a5">1.5–2.6×</text>
    <text x="586" y="336" font-size="20" fill="#fecaca">cost / solve</text>
  </g>

  <line x1="40" y1="384" x2="760" y2="384" stroke="#1e293b"/>
  <text x="40" y="420" class="mono" font-size="19" fill="#64748b">Qwen3-4B · vLLM · paper + 79 tests</text>
</svg>
