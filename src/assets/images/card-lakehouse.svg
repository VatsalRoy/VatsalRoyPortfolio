<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x=".5" y=".5" width="799" height="459" rx="20" fill="#0b1220" stroke="#24324f"/>
  <text x="40" y="52" class="mono" font-size="19" fill="#fb923c" letter-spacing="1.5">TEXT-TO-SQL · DATABRICKS</text>
  <text x="40" y="96" class="sans" font-size="34" font-weight="800" fill="#f8fafc">lakehouse-sql-eval</text>
  <text x="40" y="130" class="sans" font-size="22" fill="#94a3b8">Does a semantic layer make LLM-written SQL right?</text>

  <text x="760" y="160" text-anchor="end" class="mono" font-size="16" fill="#64748b">correct answer, 60 questions</text>
  <g class="sans" font-size="21">
    <text x="40" y="191" fill="#e2e8f0">Raw schema</text>
    <rect x="290" y="173" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="290" y="173" width="182" height="24" rx="6" fill="#f87171" class="bar"/>
    <text x="704" y="192" fill="#fca5a5" font-weight="700">46%</text>

    <text x="40" y="233" fill="#e2e8f0">+ column comments</text>
    <rect x="290" y="215" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="290" y="215" width="193" height="24" rx="6" fill="#fbbf24" class="bar b2"/>
    <text x="704" y="234" fill="#fcd34d" font-weight="700">48%</text>

    <text x="40" y="275" fill="#e2e8f0">Metric view</text>
    <rect x="290" y="257" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="290" y="257" width="327" height="24" rx="6" fill="#34d399" class="bar b3"/>
    <text x="704" y="276" fill="#6ee7b7" font-weight="700">82%</text>

    <text x="40" y="317" fill="#e2e8f0">… without synonyms</text>
    <rect x="290" y="299" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="290" y="299" width="269" height="24" rx="6" fill="#38bdf8" class="bar b4"/>
    <text x="704" y="318" fill="#7dd3fc" font-weight="700">67%</text>
  </g>
  <text x="40" y="356" class="sans" font-size="18" fill="#94a3b8"><tspan fill="#6ee7b7" font-weight="700">+36 pts</tspan> (95% CI +22 to +51) · <tspan fill="#fca5a5" font-weight="700">84%</tspan> of raw-schema misses were silent</text>

  <line x1="40" y1="374" x2="760" y2="374" stroke="#1e293b"/>
  <text x="40" y="420" class="mono" font-size="19" fill="#64748b">Unity Catalog · Lakeflow · MLflow · nightly gate</text>
</svg>
