<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <rect x=".5" y=".5" width="799" height="459" rx="20" fill="#0b1220" stroke="#24324f"/>
  <text x="40" y="52" class="mono" font-size="19" fill="#38bdf8" letter-spacing="1.5">LLM AGENTS · EVALUATION</text>
  <text x="40" y="96" class="sans" font-size="34" font-weight="800" fill="#f8fafc">Agent Reliability Bench</text>
  <text x="40" y="130" class="sans" font-size="22" fill="#94a3b8">Agents say "done." The database often disagrees.</text>

  <g class="sans" font-size="21">
    <text x="40" y="186" fill="#e2e8f0">Agent said "done"</text>
    <rect x="300" y="168" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="300" y="168" width="392" height="24" rx="6" fill="#f87171" class="bar"/>
    <text x="712" y="187" fill="#fca5a5" font-weight="700">98%</text>

    <text x="40" y="236" fill="#e2e8f0">DB confirms (pass@1)</text>
    <rect x="300" y="218" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="300" y="218" width="260" height="24" rx="6" fill="#38bdf8" class="bar b2"/>
    <text x="712" y="237" fill="#7dd3fc" font-weight="700">65%</text>

    <text x="40" y="286" fill="#e2e8f0">Succeeds all 5 runs</text>
    <rect x="300" y="268" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="300" y="268" width="116" height="24" rx="6" fill="#34d399" class="bar b3"/>
    <text x="712" y="287" fill="#6ee7b7" font-weight="700">29%</text>

    <text x="40" y="336" fill="#e2e8f0">Judge OK'd failures</text>
    <rect x="300" y="318" width="400" height="24" rx="6" fill="#1e293b"/>
    <rect x="300" y="318" width="240" height="24" rx="6" fill="#a78bfa" class="bar b4"/>
    <text x="712" y="337" fill="#c4b5fd" font-weight="700">60%</text>
  </g>

  <line x1="40" y1="374" x2="760" y2="374" stroke="#1e293b"/>
  <text x="40" y="420" class="mono" font-size="19" fill="#64748b">17 tasks × 5 runs · graded on DB state</text>
</svg>
